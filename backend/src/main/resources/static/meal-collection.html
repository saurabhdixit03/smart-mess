<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart Mess - Meal Collection</title>

    <link rel="stylesheet"
          href="css/meal-collection.css">

</head>

<body>

<div class="container">

    <h1>Smart Mess - Meal Collection</h1>

    <div class="toolbar">

        <label for="mealSession">
            Meal Session
        </label>

        <select id="mealSession">

            <option value="LUNCH">
                Lunch
            </option>

            <option value="DINNER">
                Dinner
            </option>

        </select>

        <button id="refreshBtn">
            Refresh
        </button>

    </div>

    <hr>

    <h2>Today's Collection</h2>

    <table id="collectionTable">

        <thead>

        <tr>

            <th>Customer</th>

            <th>Response</th>

            <th>Suggested Meal</th>

            <th>Suggested Extra Roti</th>

            <th>Actual Meal</th>

            <th>Actual Extra Roti</th>

            <th>Collected</th>

            <th>Action</th>

        </tr>

        </thead>

        <tbody id="collectionTableBody">

        <!-- JavaScript will populate rows -->

        </tbody>

    </table>

</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script src="js/meal-collection.js"></script>

</body>
</html>
