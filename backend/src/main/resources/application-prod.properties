# ==========================================
# Production Application
# ==========================================

spring.application.name=smart-mess

# ==========================================
# Production Database
# ==========================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# Demo Data Seeder
# ==========================================

app.seed-demo-data=false

# ==========================================
# JWT
# ==========================================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================================
# Email / SMTP
# ==========================================

spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=b65be2001@smtp-brevo.com
spring.mail.password=${BREVO_SMTP_KEY}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==========================================
# Application Mail Settings
# ==========================================

app.mail.from=${MAIL_FROM:smartmess.app@gmail.com}
app.frontend.url=${FRONTEND_URL}

# ==========================================
# Password Reset
# ==========================================

app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}