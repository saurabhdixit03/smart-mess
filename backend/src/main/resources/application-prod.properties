# ==========================================
# Production Application
# ==========================================

spring.application.name=smart-mess

# ==========================================
# Production Database
# ==========================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# Demo Data Seeder
# ==========================================

app.seed-demo-data=false

# ==========================================
# JWT
# ==========================================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================================
# Brevo HTTPS Email API
# ==========================================
app.mail.brevo.api-key=${BREVO_API_KEY}

# ==========================================
# Application Mail Settings
# ==========================================
app.mail.from=${MAIL_FROM:smartmess.app@gmail.com}
app.frontend.url=${FRONTEND_URL}

# ==========================================
# Password Reset
# ==========================================

app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}

# ==========================================
# Application Time Zone
# ==========================================

app.time-zone=${APP_TIME_ZONE:Asia/Kolkata}