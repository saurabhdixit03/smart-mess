# ==========================================
# Production Application
# ==========================================

spring.application.name=smart-mess

# ==========================================
# Production Database
# ==========================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# Demo Data Seeder
# ==========================================

app.seed-demo-data=false

# ==========================================
# JWT
# ==========================================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================================
# Brevo HTTPS Email API
# ==========================================

app.mail.brevo.api-key=${BREVO_API_KEY}

# ==========================================
# Application Mail Settings
# ==========================================

app.mail.from=${MAIL_FROM:smartmess.app@gmail.com}
app.frontend.url=${FRONTEND_URL}

# ==========================================
# Password Reset
# ==========================================

app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}

# ==========================================
# Application Time Zone
# ==========================================

app.time-zone=${APP_TIME_ZONE:Asia/Kolkata}

# ==========================================
# Automated Billing
# ==========================================

app.billing.automation.enabled=${BILLING_AUTOMATION_ENABLED:true}
app.billing.automation.poll-delay-ms=60000
app.billing.automation.initial-delay-ms=30000

# ==========================================
# Cashfree Payment Gateway
# ==========================================

app.cashfree.enabled=${CASHFREE_ENABLED:false}
app.cashfree.environment=${CASHFREE_ENVIRONMENT:SANDBOX}
app.cashfree.client-id=${CASHFREE_CLIENT_ID:}
app.cashfree.client-secret=${CASHFREE_CLIENT_SECRET:}
app.cashfree.api-version=2026-01-01

app.cashfree.return-url=${CASHFREE_RETURN_URL:}
app.cashfree.notify-url=${CASHFREE_NOTIFY_URL:}

app.cashfree.connect-timeout-millis=5000
app.cashfree.read-timeout-millis=10000
app.cashfree.order-expiry-minutes=30

# ==========================================
# Payment Reconciliation
# ==========================================

app.cashfree.reconciliation.poll-interval-ms=60000
app.cashfree.reconciliation.initial-delay-ms=30000

# ==========================================
# Notification Email Queue
# ==========================================

app.mail.notifications.enabled=${NOTIFICATION_EMAILS_ENABLED:true}
app.mail.notifications.poll-interval-ms=60000
app.mail.notifications.initial-delay-ms=30000