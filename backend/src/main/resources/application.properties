# ==========================================
# Application
# ==========================================
spring.application.name=backend

# ==========================================
# MySQL Database Configuration
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/smart_mess
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# MySQL Dialect
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# ==========================================
# Demo Data Seeder
# ==========================================
app.seed-demo-data=true

# ==========================================
# JWT Configuration
# ==========================================
jwt.secret=ReplaceThisWithAProper256BitSecretKeyForDevelopmentOnly123456789
jwt.expiration=86400000

# ===============================
# Email / SMTP Configuration
# ===============================

spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=b65be2001@smtp-brevo.com
spring.mail.password=${BREVO_SMTP_KEY}

spring.mail.properties.mail.smtp.auth=true

# ===============================
# Application Mail Settings
# ===============================

app.mail.from=${MAIL_FROM:smartmess.app@gmail.com}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}